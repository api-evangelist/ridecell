name: Ridecell
description: >-
  Ridecell is an AI-powered asset intelligence and orchestration platform for
  automotive leasing, fleet, and finance companies. Its five intelligence modules
  (Client, Spend, Supplier, Asset, and Operational Intelligence) and the "Maya" AI
  agent monitor fleets, flag invoice overcharges, track garage/supplier performance,
  optimize vehicle remarketing and residual value, and resolve idle-vehicle
  inefficiencies. The platform processes 12M+ events daily across 500K+ assets, 100+
  connected systems, and 14+ countries. It was surfaced as a portfolio company of
  Initialized Capital. Ridecell does not currently publish a public developer API,
  OpenAPI specification, or SDK; this profile captures its public information,
  security, and compliance surfaces.
